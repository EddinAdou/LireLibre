<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LireLibre - Mode Sombre Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body>
    <div id="app"></div>

    <script>
        // État global de l'application
        let state = {
            isDarkMode: localStorage.getItem('lirelibre-theme') === 'dark',
            currentPage: 'home',
            story: {
                title: '',
                description: '',
                content: ''
            }
        };

        // Appliquer le thème au démarrage
        if (state.isDarkMode) {
            document.documentElement.classList.add('dark');
        }

        // Fonctions utilitaires
        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            
            if (state.isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('lirelibre-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('lirelibre-theme', 'light');
            }
            render();
        }

        function setPage(page) {
            state.currentPage = page;
            render();
        }

        function getStats(content) {
            const words = content.split(/\\s+/).filter(w => w.length > 0).length;
            const chars = content.length;
            const readingTime = Math.ceil(words / 200);
            return { words, chars, readingTime };
        }

        // Fonction de rendu principal
        function render() {
            const app = document.getElementById('app');
            const { isDarkMode, currentPage, story } = state;
            const stats = getStats(story.content);
            
            app.className = `min-h-screen transition-colors duration-300 ${isDarkMode ? 'bg-gray-900 text-white' : 'bg-gradient-to-br from-blue-50 via-white to-purple-50 text-black'}`;
            
            let content = '';
            
            // Header global
            const header = `
                <header class="${isDarkMode ? 'bg-gray-800/95 border-gray-700' : 'bg-white/95 border-gray-200'} backdrop-blur-sm shadow-sm border-b sticky top-0 z-50 transition-colors duration-300">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-16">
                            <div onclick="setPage('home')" class="flex items-center space-x-3 group cursor-pointer">
                                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                                    <svg viewBox="0 0 24 24" class="w-5 h-5 text-white">
                                        <path fill="currentColor" d="M21,5c-1.11-0.35-2.33-0.5-3.5-0.5c-1.95,0-4.05,0.4-5.5,1.5c-1.45-1.1-3.55-1.5-5.5-1.5 C5.33,4.5,4.11,4.65,3,5v14.65c0,0.25,0.25,0.5,0.5,0.5c0.1,0,0.15-0.05,0.25-0.05c0.85-0.3,2.1-0.5,3.25-0.5 c1.85,0,3.85,0.4,5,1.5c1.15-1.1,3.15-1.5,5-1.5c1.15,0,2.4,0.2,3.25,0.5c0.1,0.05,0.15,0.05,0.25,0.05c0.25,0,0.5-0.25,0.5-0.5V5 z M12,15.5c-1.45-1.1-3.55-1.5-5.5-1.5c-1.05,0-2.05,0.15-3,0.5V7c0.95-0.35,1.95-0.5,3-0.5c1.95,0,4.05,0.4,5.5,1.5V15.5z"/>
                                    </svg>
                                </div>
                                <span class="text-2xl font-bold ${isDarkMode ? 'text-white group-hover:text-blue-300' : 'text-gray-900 group-hover:text-blue-600'} transition-colors duration-300">
                                    LireLibre
                                </span>
                            </div>

                            <nav class="hidden md:flex items-center space-x-2">
                                <button onclick="setPage('stories')" class="px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 hover:scale-105 ${isDarkMode ? 'text-gray-300 hover:text-blue-400 hover:bg-blue-900/20' : 'text-gray-600 hover:text-blue-600 hover:bg-blue-50'}">
                                    📚 Mes Histoires
                                </button>
                                <button onclick="setPage('write')" class="px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 hover:scale-105 ${isDarkMode ? 'text-gray-300 hover:text-purple-400 hover:bg-purple-900/20' : 'text-gray-600 hover:text-purple-600 hover:bg-purple-50'}">
                                    ✍️ Écrire
                                </button>
                            </nav>

                            <div class="flex items-center space-x-4">
                                <button onclick="toggleDarkMode()" class="p-2 rounded-lg transition-all duration-200 hover:scale-105 ${isDarkMode ? 'text-gray-300 hover:text-yellow-400 hover:bg-yellow-900/20' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}" title="${isDarkMode ? 'Mode clair' : 'Mode sombre'}">
                                    ${isDarkMode ? 
                                        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>' :
                                        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>'
                                    }
                                </button>
                                <div class="flex items-center space-x-3 ${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'} px-3 py-2 rounded-lg transition-colors duration-200">
                                    <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                        U
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-sm font-medium ${isDarkMode ? 'text-white' : 'text-gray-900'}">Écrivain</span>
                                        <span class="text-xs ${isDarkMode ? 'text-gray-400' : 'text-gray-500'}">En ligne</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;

            // Contenu selon la page
            if (currentPage === 'home') {
                content = `
                    <div class="max-w-4xl mx-auto px-4 py-16">
                        <div class="text-center mb-16">
                            <h1 class="text-5xl font-bold mb-6 ${isDarkMode ? 'text-white' : 'text-gray-900'}">
                                Bienvenue sur <span class="text-blue-600">LireLibre</span>
                            </h1>
                            <p class="text-xl ${isDarkMode ? 'text-gray-300' : 'text-gray-600'} mb-8">
                                La plateforme d'écriture libre avec mode sombre global et éditeur avancé.
                            </p>
                            <div class="flex justify-center gap-4">
                                <button onclick="setPage('write')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 shadow-lg">
                                    ✨ Commencer à écrire
                                </button>
                                <button onclick="setPage('stories')" class="border-2 border-blue-600 text-blue-600 hover:bg-blue-50 ${isDarkMode ? 'hover:bg-blue-900/20' : ''} px-8 py-3 rounded-xl font-semibold transition-all duration-200">
                                    📚 Mes histoires
                                </button>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-3 gap-8">
                            <div class="text-center p-6 ${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                                <div class="text-4xl mb-4">🌙</div>
                                <h3 class="text-xl font-semibold mb-2 ${isDarkMode ? 'text-white' : 'text-gray-900'}">Mode Sombre Global</h3>
                                <p class="${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Interface adaptée pour l'écriture de nuit sur tout le site</p>
                            </div>
                            <div class="text-center p-6 ${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                                <div class="text-4xl mb-4">✍️</div>
                                <h3 class="text-xl font-semibold mb-2 ${isDarkMode ? 'text-white' : 'text-gray-900'}">Éditeur Avancé</h3>
                                <p class="${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Mode plein écran et statistiques en temps réel</p>
                            </div>
                            <div class="text-center p-6 ${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                                <div class="text-4xl mb-4">📤</div>
                                <h3 class="text-xl font-semibold mb-2 ${isDarkMode ? 'text-white' : 'text-gray-900'}">Import/Export</h3>
                                <p class="${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Importez et exportez vos créations facilement</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentPage === 'write') {
                content = `
                    <div class="max-w-5xl mx-auto p-8">
                        <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border rounded-xl p-8 mb-8 shadow-sm">
                            <h2 class="text-lg font-semibold mb-6 ${isDarkMode ? 'text-white' : 'text-black'}">
                                Informations de base
                            </h2>
                            
                            <div class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium mb-3 ${isDarkMode ? 'text-gray-200' : 'text-gray-900'}">
                                        Titre de l'histoire *
                                    </label>
                                    <input
                                        type="text"
                                        value="${story.title}"
                                        onchange="state.story.title = this.value; render();"
                                        placeholder="Donnez un titre captivant à votre histoire..."
                                        class="w-full px-4 py-3 text-lg rounded-lg transition-all ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 focus:border-blue-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'}"
                                        style="direction: ltr; text-align: left;"
                                    />
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium mb-3 ${isDarkMode ? 'text-gray-200' : 'text-gray-900'}">
                                        Description (résumé)
                                    </label>
                                    <textarea
                                        value="${story.description}"
                                        onchange="state.story.description = this.value; render();"
                                        placeholder="Décrivez brièvement votre histoire pour attirer les lecteurs..."
                                        rows="4"
                                        class="w-full px-4 py-3 rounded-lg resize-none transition-all ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 focus:border-blue-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'}"
                                        style="direction: ltr; text-align: left;"
                                    ></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border rounded-xl p-8 shadow-sm">
                            <h2 class="text-lg font-semibold mb-6 ${isDarkMode ? 'text-white' : 'text-black'}">
                                Contenu de l'histoire
                            </h2>
                            
                            <textarea
                                value="${story.content}"
                                onchange="state.story.content = this.value; render();"
                                oninput="state.story.content = this.value; render();"
                                placeholder="Il était une fois...

Commencez à écrire votre histoire ici. Laissez libre cours à votre imagination !

Le mode sombre est maintenant appliqué à tout le site, pas seulement à l'éditeur."
                                rows="25"
                                class="w-full px-4 py-4 text-base leading-relaxed rounded-lg resize-none transition-all ${isDarkMode ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 focus:border-blue-400' : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500'}"
                                style="direction: ltr; text-align: left; font-family: 'Georgia', 'Times New Roman', serif; line-height: 1.8;"
                            ></textarea>
                            
                            <div class="mt-6 flex items-center gap-8 text-sm px-4 py-3 rounded-lg ${isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-50 text-gray-600'}">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Mots:</span>
                                    <span class="font-semibold ${isDarkMode ? 'text-white' : 'text-black'}">
                                        ${stats.words.toLocaleString()}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Caractères:</span>
                                    <span class="font-semibold ${isDarkMode ? 'text-white' : 'text-black'}">
                                        ${stats.chars.toLocaleString()}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Temps de lecture:</span>
                                    <span class="font-semibold ${isDarkMode ? 'text-white' : 'text-black'}">
                                        ~${stats.readingTime} min
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentPage === 'stories') {
                content = `
                    <div class="max-w-6xl mx-auto px-4 py-8">
                        <div class="flex items-center justify-between mb-8">
                            <h1 class="text-3xl font-bold ${isDarkMode ? 'text-white' : 'text-gray-900'}">Mes Histoires</h1>
                            <button onclick="setPage('write')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 transform hover:scale-105">
                                ✨ Nouvelle histoire
                            </button>
                        </div>

                        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div class="${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-200">
                                <h3 class="text-xl font-semibold mb-2 ${isDarkMode ? 'text-white' : 'text-gray-900'}">Histoire Exemple</h3>
                                <p class="${isDarkMode ? 'text-gray-300' : 'text-gray-600'} text-sm mb-4">Une histoire d'exemple avec mode sombre global...</p>
                                <div class="flex items-center justify-between text-sm ${isDarkMode ? 'text-gray-400' : 'text-gray-500'}">
                                    <span>📄 1,250 mots</span>
                                    <span>📅 Aujourd'hui</span>
                                </div>
                                <button onclick="setPage('write')" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg text-sm transition-colors">
                                    Éditer
                                </button>
                            </div>

                            <div onclick="setPage('write')" class="${isDarkMode ? 'bg-gray-800 border-gray-700 hover:bg-gray-750' : 'bg-white border-gray-200 hover:bg-gray-50'} border-2 border-dashed rounded-xl p-6 cursor-pointer transition-all duration-200 hover:border-blue-400">
                                <div class="text-center">
                                    <div class="text-4xl mb-4">➕</div>
                                    <h3 class="text-lg font-semibold mb-2 ${isDarkMode ? 'text-white' : 'text-gray-900'}">Nouvelle Histoire</h3>
                                    <p class="${isDarkMode ? 'text-gray-400' : 'text-gray-500'} text-sm">Cliquez pour commencer à écrire</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            app.innerHTML = header + content;
        }

        // Rendu initial
        render();
    </script>
</body>
</html>
