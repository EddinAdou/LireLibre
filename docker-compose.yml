version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: lirelibre_postgres
    environment:
      POSTGRES_DB: lirelibre
      POSTGRES_USER: lirelibre
      POSTGRES_PASSWORD: lirelibre_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lirelibre"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lirelibre_network

  # pgAdmin pour l'administration de la base de données
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lirelibre_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lirelibre.fr
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "5051:80"
    depends_on:
      - database
    networks:
      - lirelibre_network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: lirelibre_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lirelibre_network

  # Backend Symfony
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lirelibre_backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: your-secret-key-change-this-in-production
      DATABASE_URL: postgresql://lirelibre:lirelibre_password@database:5432/lirelibre
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: your-jwt-passphrase-change-this
      CORS_ALLOW_ORIGIN: http://localhost:3000
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - backend_var:/var/www/html/var
    working_dir: /var/www/html
    networks:
      - lirelibre_network

  # Nginx pour le backend
  nginx-backend:
    image: nginx:alpine
    container_name: lirelibre_nginx_backend
    depends_on:
      - backend
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - lirelibre_network

  # Frontend React (développement)
  frontend:
    image: node:18-alpine
    container_name: lirelibre_frontend
    working_dir: /app
    depends_on:
      - nginx-backend
    environment:
      VITE_API_URL: http://localhost:8080/api
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    networks:
      - lirelibre_network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  backend_vendor:
  backend_var:
  frontend_node_modules:

networks:
  lirelibre_network:
    driver: bridge
