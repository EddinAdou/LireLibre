name: 🛡️ Branch Protection Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/branch-protection.yml'

jobs:
  setup-branch-protection:
    name: Configure Branch Protection Rules
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Setup branch protection for main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            
            try {
              // Configuration de protection pour la branche main
              await github.rest.repos.updateBranchProtection({
                owner,
                repo,
                branch: 'main',
                required_status_checks: {
                  strict: true,
                  contexts: [
                    'Code Quality & Security',
                    'Frontend Tests', 
                    'Backend Tests',
                    'Security Analysis'
                  ]
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false,
                  require_last_push_approval: false
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false,
                block_creations: false
              });
              
              console.log('✅ Protection de branche configurée pour main');
            } catch (error) {
              console.log('⚠️ Erreur lors de la configuration:', error.message);
              // Ne pas échouer si l'utilisateur n'a pas les permissions
              if (error.status === 403) {
                console.log('💡 Permissions insuffisantes - configuration manuelle requise');
              }
            }

      - name: 🛡️ Setup branch protection for develop
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            
            try {
              await github.rest.repos.updateBranchProtection({
                owner,
                repo, 
                branch: 'develop',
                required_status_checks: {
                  strict: true,
                  contexts: [
                    'Code Quality & Security',
                    'Frontend Tests',
                    'Backend Tests'
                  ]
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false
              });
              
              console.log('✅ Protection de branche configurée pour develop');
            } catch (error) {
              console.log('⚠️ Erreur pour develop:', error.message);
              if (error.status === 404) {
                console.log('💡 Branche develop n\'existe pas encore');
              }
            }

      - name: 📋 Summary
        run: |
          echo "🛡️ Configuration de protection des branches terminée"
          echo ""
          echo "🔒 Règles appliquées:"
          echo "  - Tests requis avant merge"
          echo "  - Au moins 1 approbation requise"
          echo "  - Révisions obsolètes rejetées"
          echo "  - Push forcé bloqué"
          echo "  - Suppression de branche bloquée"
          echo ""
          echo "💡 Si vous voyez des erreurs de permissions, configurez manuellement:"
          echo "   Settings > Branches > Add rule"