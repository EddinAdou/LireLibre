name: 🛡️ Branch Protection Setup

on:
  workflow_dispatch: # Déclenchement manuel

jobs:
  setup-branch-protection:
    name: 🔒 Configure Branch Protection
    runs-on: ubuntu-latest
    
    steps:
      - name: 🛡️ Protect main branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                required_status_checks: {
                  strict: true,
                  contexts: [
                    'frontend-tests',
                    'backend-tests',
                    'security-scan',
                    'build-validation'
                  ]
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false,
                  bypass_pull_request_allowances: {
                    users: [],
                    teams: []
                  }
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false,
                block_creations: false,
                required_conversation_resolution: true
              });
              
              console.log('✅ Main branch protection configured');
            } catch (error) {
              console.log('❌ Failed to configure main branch protection:', error.message);
            }
            
      - name: 🛡️ Protect develop branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.updateBranchProtection({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'develop',
                required_status_checks: {
                  strict: true,
                  contexts: [
                    'frontend-tests',
                    'backend-tests',
                    'security-scan'
                  ]
                },
                enforce_admins: false,
                required_pull_request_reviews: {
                  required_approving_review_count: 1,
                  dismiss_stale_reviews: true,
                  require_code_owner_reviews: false
                },
                restrictions: null,
                allow_force_pushes: false,
                allow_deletions: false,
                block_creations: false,
                required_conversation_resolution: false
              });
              
              console.log('✅ Develop branch protection configured');
            } catch (error) {
              console.log('❌ Failed to configure develop branch protection:', error.message);
            }
