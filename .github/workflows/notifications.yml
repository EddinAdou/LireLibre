name: 📢 Advanced Notifications

on:
  workflow_run:
    workflows: ["🚀 LireLibre CI/CD Pipeline"]
    types:
      - completed
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed]
  release:
    types: [published]

jobs:
  notify-pipeline-status:
    name: Pipeline Status Notification
    runs-on: ubuntu-latest
    if: github.event.workflow_run
    
    steps:
      - name: 📥 Get workflow info
        id: workflow-info
        run: |
          echo "status=${{ github.event.workflow_run.conclusion }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "commit=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: 🎉 Success notification
        if: steps.workflow-info.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ steps.workflow-info.outputs.branch }}';
            const commit = '${{ steps.workflow-info.outputs.commit }}';
            
            if (context.payload.workflow_run.event === 'pull_request') {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open'
              });
              
              if (prs.data.length > 0) {
                const pr = prs.data[0];
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: `🎉 **Pipeline CI/CD réussi !** ✅\n\n📦 Tous les tests sont passés\n🔒 Scans de sécurité OK\n🚀 Build réussi\n📋 Commit: \`${commit.slice(0, 7)}\`\n\nCette PR est prête pour la revue ! 👍`
                });
              }
            }

      - name: ❌ Failure notification
        if: steps.workflow-info.outputs.status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ steps.workflow-info.outputs.branch }}';
            const commit = '${{ steps.workflow-info.outputs.commit }}';
            
            if (context.payload.workflow_run.event === 'pull_request') {
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open'
              });
              
              if (prs.data.length > 0) {
                const pr = prs.data[0];
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: `❌ **Échec du pipeline CI/CD** 🚨\n\n🔍 Des problèmes ont été détectés :\n- Vérifiez les tests qui échouent\n- Consultez les logs de sécurité\n- Corrigez les erreurs de build\n\n📋 Commit: \`${commit.slice(0, 7)}\`\n🔗 Voir les détails dans Actions\n\nMerci de corriger avant le merge ! 🔧`
                });
              }
            }

  notify-release:
    name: Release Notification
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: 🚀 New release notification
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📦 Nouvelle version ${release.tag_name} disponible !`,
              body: `🎉 **Une nouvelle version de LireLibre vient d'être publiée !**\n\n## 📋 Version: ${release.tag_name}\n\n### 🔗 Liens utiles:\n- Notes de version: ${release.html_url}\n- Images Docker disponibles\n\n### 🚀 Déploiement:\nLes nouvelles images Docker sont automatiquement disponibles\n\n${release.body || 'Voir les notes de version complètes ci-dessus.'}\n\n*Cette issue a été créée automatiquement par le système CI/CD* 🤖`,
              labels: ['release', 'announcement']
            });

  notify-pr-events:
    name: PR Event Notifications
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📝 PR opened notification
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `👋 **Merci pour cette Pull Request !**\n\n🔄 Le pipeline CI/CD va maintenant :\n- ✅ Vérifier la qualité du code\n- 🧪 Exécuter tous les tests\n- 🔒 Scanner les vulnérabilités de sécurité\n- 🏗️ Tester le build\n\n📋 **Checklist pour le reviewer:**\n- [ ] Code conforme aux standards\n- [ ] Tests ajoutés/mis à jour si nécessaire\n- [ ] Documentation mise à jour\n- [ ] Pas de vulnérabilités introduites\n\n*Les résultats apparaîtront ici automatiquement* 🤖`
            });

      - name: 🎉 PR merged notification
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `🎉 **Pull Request mergée avec succès !**\n\n✅ Changements intégrés dans \`${pr.base.ref}\`\n🚀 Le déploiement automatique va commencer\n📦 Une nouvelle version sera créée si nécessaire\n\nMerci pour votre contribution ! 👏`
            });