name: 📢 Notification Webhook

on:
  pull_request:
    types: [opened, closed, reopened]
  push:
    branches: [main, develop]
  release:
    types: [published]
  workflow_run:
    workflows: ["🚀 CI/CD Pipeline Avancé"]
    types: [completed]

jobs:
  notify:
    name: 📢 Send Notifications
    runs-on: ubuntu-latest
    
    steps:
      - name: 📢 Discord/Slack Notification
        uses: actions/github-script@v7
        with:
          script: |
            const { context } = require('@actions/github');
            
            let message = '';
            let color = 0x00ff00; // Green by default
            
            switch (context.eventName) {
              case 'pull_request':
                const pr = context.payload.pull_request;
                const action = context.payload.action;
                
                if (action === 'opened') {
                  message = `🔀 **Nouvelle PR ouverte**\n` +
                          `📝 **${pr.title}**\n` +
                          `👤 Par: ${pr.user.login}\n` +
                          `🔗 [Voir la PR](${pr.html_url})`;
                  color = 0x0099ff;
                } else if (action === 'closed' && pr.merged) {
                  message = `✅ **PR mergée avec succès**\n` +
                          `📝 **${pr.title}**\n` +
                          `👤 Par: ${pr.user.login}\n` +
                          `🎯 Branche: ${pr.base.ref}`;
                  color = 0x00ff00;
                }
                break;
                
              case 'push':
                const commits = context.payload.commits;
                const branch = context.payload.ref.replace('refs/heads/', '');
                
                if (commits.length > 0) {
                  message = `📦 **Nouveau push sur ${branch}**\n` +
                          `📝 ${commits.length} commit(s)\n` +
                          `👤 Par: ${context.payload.pusher.name}\n` +
                          `💬 Dernier commit: ${commits[commits.length - 1].message}`;
                  color = branch === 'main' ? 0xff9900 : 0x0099ff;
                }
                break;
                
              case 'release':
                const release = context.payload.release;
                message = `🚀 **Nouvelle release publiée**\n` +
                        `🏷️ **Version: ${release.tag_name}**\n` +
                        `📝 ${release.name}\n` +
                        `🔗 [Voir la release](${release.html_url})`;
                color = 0xff6600;
                break;
                
              case 'workflow_run':
                const workflow = context.payload.workflow_run;
                const conclusion = workflow.conclusion;
                
                if (conclusion === 'success') {
                  message = `✅ **Pipeline réussie**\n` +
                          `⚙️ Workflow: ${workflow.name}\n` +
                          `🌟 Branche: ${workflow.head_branch}`;
                  color = 0x00ff00;
                } else if (conclusion === 'failure') {
                  message = `❌ **Pipeline échouée**\n` +
                          `⚙️ Workflow: ${workflow.name}\n` +
                          `🔥 Branche: ${workflow.head_branch}\n` +
                          `🔗 [Voir les logs](${workflow.html_url})`;
                  color = 0xff0000;
                }
                break;
            }
            
            if (message) {
              console.log('📢 Notification:', message);
              
              // Ici vous pouvez ajouter l'intégration avec Discord/Slack
              // Exemple pour Discord:
              /*
              const discordWebhook = process.env.DISCORD_WEBHOOK_URL;
              if (discordWebhook) {
                const payload = {
                  embeds: [{
                    title: "LireLibre - Notification",
                    description: message,
                    color: color,
                    timestamp: new Date().toISOString(),
                    footer: {
                      text: "LireLibre CI/CD"
                    }
                  }]
                };
                
                await fetch(discordWebhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
              }
              */
            }

  # Notification par email pour les événements critiques
  email-notification:
    name: 📧 Email Alerts
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    
    steps:
      - name: 📧 Send Email Alert
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && '[URGENT] Pipeline Failed' || 'Production Deployment' }} - LireLibre
          body: |
            ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && 
            format('🚨 PIPELINE FAILURE ALERT

            Repository: {0}
            Workflow: {1}
            Branch: {2}
            Commit: {3}

            Please check the logs immediately: {4}', 
            github.repository, 
            github.event.workflow_run.name, 
            github.event.workflow_run.head_branch,
            github.event.workflow_run.head_sha,
            github.event.workflow_run.html_url) ||
            
            format('🚀 PRODUCTION DEPLOYMENT

            Repository: {0}
            Branch: main
            Commits: {1}
            Pusher: {2}

            Latest commit: {3}', 
            github.repository,
            github.event.commits | length,
            github.event.pusher.name,
            github.event.commits[-1].message) }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: LireLibre CI/CD <${{ secrets.EMAIL_USERNAME }}>
        continue-on-error: true
