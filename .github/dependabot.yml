version: 2
updates:
  # Frontend Dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "EddinAdou"
    assignees:
      - "EddinAdou"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "auto-merge-candidate"
    ignore:
      # Ignorer les mises à jour majeures pour plus de sécurité
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend Dependencies (composer)
  - package-ecosystem: "composer"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    open-pull-requests-limit: 5
    reviewers:
      - "EddinAdou"
    assignees:
      - "EddinAdou"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "auto-merge-candidate"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker Base Images
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    reviewers:
      - "EddinAdou"
    assignees:
      - "EddinAdou"
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "infrastructure"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    reviewers:
      - "EddinAdou"
    assignees:
      - "EddinAdou"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci/cd"
      - "auto-merge-candidate"
