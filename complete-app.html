<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LireLibre - Plateforme Complète</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- L'interface sera générée par JavaScript -->
    </div>

    <script>
        // État global de l'application
        let globalState = {
            isDarkMode: localStorage.getItem('lirelibre-theme') === 'dark',
            isFullScreen: false,
            currentPage: 'home',
            story: {
                title: '',
                description: '',
                content: '',
                status: 'draft'
            },
            user: {
                isAuthenticated: true,
                username: 'TestUser',
                email: 'test@example.com'
            }
        };

        // Appliquer le thème au démarrage
        if (globalState.isDarkMode) {
            document.documentElement.classList.add('dark');
        }

        // Fonction pour calculer les statistiques
        function getStats(content) {
            const words = content.split(/\s+/).filter(w => w.length > 0).length;
            const chars = content.length;
            const readingTime = Math.ceil(words / 200);
            return { words, chars, readingTime };
        }

        // Fonction pour afficher une notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 px-6 py-3 rounded-lg text-white font-medium z-50 transition-all duration-300 \${
                type === 'success' ? 'bg-green-500' : 'bg-red-500'
            }`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => document.body.removeChild(toast), 300);
            }, 3000);
        }

        // Fonctions globales
        function toggleDarkMode() {
            globalState.isDarkMode = !globalState.isDarkMode;
            
            if (globalState.isDarkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('lirelibre-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('lirelibre-theme', 'light');
            }
            render();
        }

        function toggleFullScreen() {
            globalState.isFullScreen = !globalState.isFullScreen;
            render();
        }

        function setCurrentPage(page) {
            globalState.currentPage = page;
            render();
        }

        function updateStory(field, value) {
            globalState.story[field] = value;
            render();
        }

        // Fonction pour sauvegarder
        function handleSave() {
            if (!globalState.story.title.trim()) {
                showToast('Le titre est obligatoire', 'error');
                return;
            }
            
            console.log('Sauvegarde:', globalState.story);
            showToast('Histoire sauvegardée avec succès !');
        }

        // Fonction pour importer un fichier
        function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                globalState.story.content = e.target.result;
                if (!globalState.story.title) {
                    globalState.story.title = file.name.replace(/\.[^/.]+$/, '');
                }
                render();
                showToast('Fichier importé avec succès !');
            };
            reader.readAsText(file);
        }

        // Fonction pour exporter
        function handleExport() {
            if (!globalState.story.content) return;
            
            const element = document.createElement('a');
            const file = new Blob([globalState.story.content], { type: 'text/plain' });
            element.href = URL.createObjectURL(file);
            element.download = `\${globalState.story.title || 'histoire'}.txt`;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
            showToast('Histoire exportée !');
        }

        // Composant Header global
        function renderHeader() {
            const { isDarkMode, user } = globalState;
            
            return `
                <header class="\${isDarkMode ? 'bg-gray-800/95 border-gray-700' : 'bg-white/95 border-gray-200'} backdrop-blur-sm shadow-sm border-b sticky top-0 z-50 transition-colors duration-300">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex justify-between items-center h-16">
                            <!-- Logo -->
                            <div onclick="setCurrentPage('home')" class="flex items-center space-x-3 group cursor-pointer">
                                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                                    <svg viewBox="0 0 24 24" class="w-5 h-5 text-white">
                                        <path fill="currentColor" d="M21,5c-1.11-0.35-2.33-0.5-3.5-0.5c-1.95,0-4.05,0.4-5.5,1.5c-1.45-1.1-3.55-1.5-5.5-1.5 C5.33,4.5,4.11,4.65,3,5v14.65c0,0.25,0.25,0.5,0.5,0.5c0.1,0,0.15-0.05,0.25-0.05c0.85-0.3,2.1-0.5,3.25-0.5 c1.85,0,3.85,0.4,5,1.5c1.15-1.1,3.15-1.5,5-1.5c1.15,0,2.4,0.2,3.25,0.5c0.1,0.05,0.15,0.05,0.25,0.05c0.25,0,0.5-0.25,0.5-0.5V5 z M12,15.5c-1.45-1.1-3.55-1.5-5.5-1.5c-1.05,0-2.05,0.15-3,0.5V7c0.95-0.35,1.95-0.5,3-0.5c1.95,0,4.05,0.4,5.5,1.5V15.5z"/>
                                    </svg>
                                </div>
                                <span class="text-2xl font-bold \${isDarkMode ? 'text-white group-hover:text-blue-300' : 'text-gray-900 group-hover:text-blue-600'} transition-colors duration-300">
                                    LireLibre
                                </span>
                            </div>

                            <!-- Navigation -->
                            <nav class="hidden md:flex items-center space-x-2">
                                <button onclick="setCurrentPage('search')" class="px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 hover:scale-105 \${isDarkMode ? 'text-gray-300 hover:text-green-400 hover:bg-green-900/20' : 'text-gray-600 hover:text-green-600 hover:bg-green-50'}">
                                    🔍 Rechercher
                                </button>
                                <button onclick="setCurrentPage('stories')" class="px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 hover:scale-105 \${isDarkMode ? 'text-gray-300 hover:text-blue-400 hover:bg-blue-900/20' : 'text-gray-600 hover:text-blue-600 hover:bg-blue-50'}">
                                    📚 Mes Histoires
                                </button>
                                <button onclick="setCurrentPage('write')" class="flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 hover:scale-105 \${isDarkMode ? 'text-gray-300 hover:text-purple-400 hover:bg-purple-900/20' : 'text-gray-600 hover:text-purple-600 hover:bg-purple-50'}">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                    <span>Écrire</span>
                                </button>
                            </nav>

                            <!-- Actions utilisateur -->
                            <div class="flex items-center space-x-4">
                                <!-- Bouton mode sombre -->
                                <button onclick="toggleDarkMode()" class="p-2 rounded-lg transition-all duration-200 hover:scale-105 \${isDarkMode ? 'text-gray-300 hover:text-yellow-400 hover:bg-yellow-900/20' : 'text-gray-600 hover:text-gray-900 hover:bg-gray-100'}" title="\${isDarkMode ? 'Mode clair' : 'Mode sombre'}">
                                    \${isDarkMode ? 
                                        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>' :
                                        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>'
                                    }
                                </button>

                                <!-- Profil utilisateur -->
                                <div class="flex items-center space-x-3 \${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'} px-3 py-2 rounded-lg transition-colors duration-200">
                                    <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                        \${user.username.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="flex flex-col">
                                        <span class="text-sm font-medium \${isDarkMode ? 'text-white' : 'text-gray-900'}">\${user.username}</span>
                                        <span class="text-xs \${isDarkMode ? 'text-gray-400' : 'text-gray-500'}">Écrivain</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            `;
        }

        // Composant Home
        function renderHome() {
            const { isDarkMode } = globalState;
            return `
                <div class="max-w-4xl mx-auto px-4 py-16">
                    <div class="text-center mb-16">
                        <h1 class="text-5xl font-bold mb-6 \${isDarkMode ? 'text-white' : 'text-gray-900'}">
                            Bienvenue sur <span class="text-blue-600">LireLibre</span>
                        </h1>
                        <p class="text-xl \${isDarkMode ? 'text-gray-300' : 'text-gray-600'} mb-8">
                            La plateforme d'écriture libre et collaborative. Créez, partagez et découvrez des histoires incroyables.
                        </p>
                        <div class="flex justify-center gap-4">
                            <button onclick="setCurrentPage('write')" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-semibold transition-all duration-200 transform hover:scale-105 shadow-lg">
                                ✨ Commencer à écrire
                            </button>
                            <button onclick="setCurrentPage('stories')" class="border-2 border-blue-600 text-blue-600 hover:bg-blue-50 \${isDarkMode ? 'hover:bg-blue-900/20' : ''} px-8 py-3 rounded-xl font-semibold transition-all duration-200">
                                📚 Parcourir les histoires
                            </button>
                        </div>
                    </div>

                    <!-- Fonctionnalités -->
                    <div class="grid md:grid-cols-3 gap-8">
                        <div class="text-center p-6 \${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                            <div class="text-4xl mb-4">✍️</div>
                            <h3 class="text-xl font-semibold mb-2 \${isDarkMode ? 'text-white' : 'text-gray-900'}">Éditeur Avancé</h3>
                            <p class="\${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Mode sombre, plein écran et statistiques en temps réel</p>
                        </div>
                        <div class="text-center p-6 \${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                            <div class="text-4xl mb-4">🌙</div>
                            <h3 class="text-xl font-semibold mb-2 \${isDarkMode ? 'text-white' : 'text-gray-900'}">Mode Sombre Global</h3>
                            <p class="\${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Interface adaptée pour l'écriture de nuit</p>
                        </div>
                        <div class="text-center p-6 \${isDarkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-lg">
                            <div class="text-4xl mb-4">📤</div>
                            <h3 class="text-xl font-semibold mb-2 \${isDarkMode ? 'text-white' : 'text-gray-900'}">Import/Export</h3>
                            <p class="\${isDarkMode ? 'text-gray-300' : 'text-gray-600'}">Importez vos textes existants ou exportez vos créations</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Composant Write (éditeur)
        function renderWrite() {
            const { isDarkMode, isFullScreen, story } = globalState;
            const stats = getStats(story.content);
            
            const themeClasses = isDarkMode ? 'bg-gray-900 text-white' : 'bg-white text-black';
            const cardClasses = isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200';
            const inputClasses = isDarkMode 
                ? 'bg-gray-700 border-gray-600 text-white focus:ring-blue-400 focus:border-blue-400' 
                : 'border-gray-300 focus:ring-blue-500 focus:border-blue-500';

            return `
                <div class="\${isFullScreen ? 'fixed inset-0 z-50' : ''} \${themeClasses}">
                    \${isFullScreen ? `
                        <!-- Header plein écran -->
                        <div class="\${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border-b px-6 py-4">
                            <div class="flex items-center justify-between">
                                <h1 class="text-xl font-bold">LireLibre - Mode Concentration</h1>
                                <div class="flex items-center gap-3">
                                    <button onclick="toggleFullScreen()" class="p-2 rounded-lg transition-colors \${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}" title="Quitter plein écran">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                    <button onclick="handleSave()" class="flex items-center gap-2 px-6 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                        Sauvegarder
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="\${isFullScreen ? 'h-full overflow-auto' : ''} max-w-5xl mx-auto p-8">
                        <!-- Zone titre et description - cachée en mode plein écran -->
                        \${!isFullScreen ? `
                            <div class="\${cardClasses} rounded-xl p-8 mb-8 shadow-sm">
                                <div class="flex items-center justify-between mb-6">
                                    <h2 class="text-lg font-semibold \${isDarkMode ? 'text-white' : 'text-black'}">
                                        Informations de base
                                    </h2>
                                    <button onclick="toggleFullScreen()" class="p-2 rounded-lg transition-colors \${isDarkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-100'}" title="Mode plein écran">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                                    </button>
                                </div>
                                
                                <div class="space-y-6">
                                    <div>
                                        <label class="block text-sm font-medium mb-3 \${isDarkMode ? 'text-gray-200' : 'text-gray-900'}">
                                            Titre de l'histoire *
                                        </label>
                                        <input
                                            type="text"
                                            value="\${story.title}"
                                            onchange="updateStory('title', this.value)"
                                            placeholder="Donnez un titre captivant à votre histoire..."
                                            class="w-full px-4 py-3 text-lg rounded-lg transition-all \${inputClasses}"
                                            style="direction: ltr; text-align: left; font-family: system-ui, -apple-system, sans-serif;"
                                        />
                                    </div>
                                    
                                    <div>
                                        <label class="block text-sm font-medium mb-3 \${isDarkMode ? 'text-gray-200' : 'text-gray-900'}">
                                            Description (résumé)
                                        </label>
                                        <textarea
                                            value="\${story.description}"
                                            onchange="updateStory('description', this.value)"
                                            placeholder="Décrivez brièvement votre histoire pour attirer les lecteurs..."
                                            rows="4"
                                            class="w-full px-4 py-3 rounded-lg resize-none transition-all \${inputClasses}"
                                            style="direction: ltr; text-align: left; font-family: system-ui, -apple-system, sans-serif;"
                                        ></textarea>
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- Zone d'écriture -->
                        <div class="\${cardClasses} rounded-xl p-8 shadow-sm \${isFullScreen ? 'h-full flex flex-col' : ''}">
                            <div class="flex items-center justify-between mb-6">
                                <h2 class="text-lg font-semibold \${isDarkMode ? 'text-white' : 'text-black'}">
                                    \${isFullScreen ? 'Mode Écriture Plein Écran' : 'Contenu de l\'histoire'}
                                </h2>
                                <div class="flex items-center gap-2">
                                    <input type="file" accept=".txt,.md" onchange="handleImport(event)" class="hidden" id="file-import">
                                    <label for="file-import">
                                        <button class="flex items-center gap-2 px-3 py-2 \${isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'} rounded-lg transition-colors text-sm">
                                            📤 Import
                                        </button>
                                    </label>
                                    <button onclick="handleExport()" class="flex items-center gap-2 px-3 py-2 \${isDarkMode ? 'bg-gray-700 text-gray-200 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'} rounded-lg transition-colors text-sm">
                                        📥 Export
                                    </button>
                                    \${!isFullScreen ? `
                                        <button onclick="handleSave()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg transition-colors text-sm">
                                            💾 Sauvegarder
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                            
                            <textarea
                                value="\${story.content}"
                                onchange="updateStory('content', this.value)"
                                oninput="updateStory('content', this.value)"
                                placeholder="\${isFullScreen 
                                    ? 'Mode concentration activé. Écrivez votre histoire en toute tranquillité...' 
                                    : 'Il était une fois...\\n\\nCommencez à écrire votre histoire ici. Laissez libre cours à votre imagination !\\n\\nUtilisez les options d\\'import pour charger un texte existant ou écrivez directement dans cet éditeur.'
                                }"
                                \${isFullScreen ? '' : 'rows="25"'}
                                class="w-full px-4 py-4 text-base leading-relaxed rounded-lg resize-none transition-all \${inputClasses} \${isFullScreen ? 'flex-1 h-full min-h-0' : ''}"
                                style="direction: ltr; text-align: left; font-family: 'Georgia', 'Times New Roman', serif; line-height: 1.8;"
                            ></textarea>
                            
                            <!-- Statistiques -->
                            <div class="mt-6 flex items-center gap-8 text-sm px-4 py-3 rounded-lg \${isDarkMode ? 'bg-gray-700 text-gray-300' : 'bg-gray-50 text-gray-600'}">
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Mots:</span>
                                    <span class="font-semibold \${isDarkMode ? 'text-white' : 'text-black'}">
                                        \${stats.words.toLocaleString()}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Caractères:</span>
                                    <span class="font-semibold \${isDarkMode ? 'text-white' : 'text-black'}">
                                        \${stats.chars.toLocaleString()}
                                    </span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="font-medium">Temps de lecture:</span>
                                    <span class="font-semibold \${isDarkMode ? 'text-white' : 'text-black'}">
                                        ~\${stats.readingTime} min
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Composant Stories
        function renderStories() {
            const { isDarkMode } = globalState;
            return `
                <div class="max-w-6xl mx-auto px-4 py-8">
                    <div class="flex items-center justify-between mb-8">
                        <h1 class="text-3xl font-bold \${isDarkMode ? 'text-white' : 'text-gray-900'}">Mes Histoires</h1>
                        <button onclick="setCurrentPage('write')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-200 transform hover:scale-105">
                            ✨ Nouvelle histoire
                        </button>
                    </div>

                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Exemple d'histoire -->
                        <div class="\${isDarkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'} border rounded-xl p-6 shadow-lg hover:shadow-xl transition-all duration-200">
                            <h3 class="text-xl font-semibold mb-2 \${isDarkMode ? 'text-white' : 'text-gray-900'}">Histoire Exemple</h3>
                            <p class="\${isDarkMode ? 'text-gray-300' : 'text-gray-600'} text-sm mb-4">Une histoire d'exemple pour tester l'interface...</p>
                            <div class="flex items-center justify-between text-sm \${isDarkMode ? 'text-gray-400' : 'text-gray-500'}">
                                <span>📄 1,250 mots</span>
                                <span>📅 Aujourd'hui</span>
                            </div>
                            <div class="mt-4 flex gap-2">
                                <button onclick="setCurrentPage('write')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-lg text-sm transition-colors">
                                    Éditer
                                </button>
                                <button class="px-4 py-2 border \${isDarkMode ? 'border-gray-600 text-gray-300 hover:bg-gray-700' : 'border-gray-300 text-gray-700 hover:bg-gray-50'} rounded-lg text-sm transition-colors">
                                    Voir
                                </button>
                            </div>
                        </div>

                        <!-- Placeholder pour nouvelles histoires -->
                        <div onclick="setCurrentPage('write')" class="\${isDarkMode ? 'bg-gray-800 border-gray-700 hover:bg-gray-750' : 'bg-white border-gray-200 hover:bg-gray-50'} border-2 border-dashed rounded-xl p-6 cursor-pointer transition-all duration-200 hover:border-blue-400">
                            <div class="text-center">
                                <div class="text-4xl mb-4">➕</div>
                                <h3 class="text-lg font-semibold mb-2 \${isDarkMode ? 'text-white' : 'text-gray-900'}">Nouvelle Histoire</h3>
                                <p class="\${isDarkMode ? 'text-gray-400' : 'text-gray-500'} text-sm">Cliquez pour commencer à écrire</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Composant Search
        function renderSearch() {
            const { isDarkMode } = globalState;
            return `
                <div class="max-w-4xl mx-auto px-4 py-8">
                    <h1 class="text-3xl font-bold \${isDarkMode ? 'text-white' : 'text-gray-900'} mb-8">Rechercher des histoires</h1>
                    
                    <div class="mb-8">
                        <input type="text" placeholder="Rechercher par titre, auteur ou mot-clé..." class="w-full px-6 py-4 text-lg rounded-xl \${isDarkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-300'} border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                    </div>

                    <div class="\${isDarkMode ? 'text-gray-300' : 'text-gray-600'} text-center py-16">
                        <div class="text-6xl mb-4">🔍</div>
                        <h2 class="text-xl font-semibold mb-2">Découvrez de nouvelles histoires</h2>
                        <p>Utilisez la barre de recherche pour trouver des histoires par titre, auteur ou mot-clé.</p>
                    </div>
                </div>
            `;
        }

        // Fonction de rendu principal
        function render() {
            const { isDarkMode, currentPage, isFullScreen } = globalState;
            
            let content = '';
            
            // Rendu conditionnel selon la page actuelle
            switch(currentPage) {
                case 'home':
                    content = renderHome();
                    break;
                case 'write':
                    content = renderWrite();
                    break;
                case 'stories':
                    content = renderStories();
                    break;
                case 'search':
                    content = renderSearch();
                    break;
                default:
                    content = renderHome();
            }

            document.getElementById('app').innerHTML = `
                <div class="\${isDarkMode ? 'bg-gray-900 text-white' : 'bg-gradient-to-br from-blue-50 via-white to-purple-50 text-black'} min-h-screen transition-colors duration-300">
                    \${!isFullScreen ? renderHeader() : ''}
                    \${content}
                </div>
            `;
        }

        // Rendu initial
        render();
    </script>
</body>
</html>
