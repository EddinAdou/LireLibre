version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lirelibre
      POSTGRES_USER: lirelibre
      POSTGRES_PASSWORD: lirelibre_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lirelibre"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Symfony
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_SECRET: your-secret-key-here
      DATABASE_URL: postgresql://lirelibre:lirelibre_password@database:5432/lirelibre
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: '%kernel.project_dir%/config/jwt/private.pem'
      JWT_PUBLIC_KEY: '%kernel.project_dir%/config/jwt/public.pem'
      JWT_PASSPHRASE: your-jwt-passphrase
      CORS_ALLOW_ORIGIN: http://localhost:3000
    volumes:
      - ../backend:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:9000"

  # Nginx pour le backend
  nginx-backend:
    image: nginx:alpine
    depends_on:
      - backend
    volumes:
      - ../backend/public:/var/www/html/public
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"

  # Frontend React (développement)
  frontend:
    image: node:18-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
